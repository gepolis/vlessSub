services:
  vless-list:
    build: .
    container_name: vless-list
    restart: unless-stopped
    expose:
      - "5151"
    environment:
      - PORT=5151
      - CHECK_INTERVAL=900
      - CONCURRENCY_LIMIT=10
      - MAX_PING_MS=1000
      - TIMEOUT_PING=5
      - EXTRA_VLESS_URL=${EXTRA_VLESS_URL}
    volumes:
      - ./vless-data:/app/vless-data
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: vless-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - vless-list
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: vless-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal

networks:
  internal:
