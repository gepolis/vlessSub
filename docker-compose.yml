services:
  vless-list:
    build: .
    container_name: vless-list
    restart: unless-stopped
    ports:
      - "5151:5151"
    environment:
      - PORT=5151
      - CHECK_INTERVAL=900
      - CONCURRENCY_LIMIT=10
      - MAX_PING_MS=1000
      - TIMEOUT_PING=5
      - EXTRA_VLESS_URL=vless://<UUID>@<HOST>:<PORT>?encryption=none&security=reality&sni=<SNI>&fp=chrome&pbk=<PUBLIC_KEY>&sid=<SHORT_ID>&type=tcp#Для+коти+%F0%9F%91%87%F0%9F%91%87%F0%9F%91%87
    volumes:
      - ./working_vless.txt:/app/working_vless.txt
